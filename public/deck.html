<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexora Deck Builder</title><style>body{margin:0;background:#06101c;color:#eef7ff;font:14px Arial}main{max-width:800px;margin:30px auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}.c{padding:12px;background:#102437;border:1px solid #315a76;border-radius:9px}.c button{margin-top:7px}.deck{background:#0b1928;padding:15px;margin-top:20px}.c button,.save{padding:7px;border:0;border-radius:6px;background:#2474b8;color:white}.row{display:flex;justify-content:space-between;padding:7px;border-bottom:1px solid #234}button{cursor:pointer}</style></head><body><main><h1>NEXORA DECK BUILDER</h1><p>40 cards required. Maximum 4 copies.</p><div id="grid" class="grid"></div><section class="deck"><h2 id="count">0 / 40</h2><div id="list"></div><button class="save" onclick="save()">SAVE</button><button onclick="location.href='index.html'">ONLINE ARENA</button></section></main><script src="cards.js"></script><script>let d=JSON.parse(localStorage.getItem("nexoraDeck")||"[]");function r(){grid.innerHTML=NEXORA_CARDS.map(c=>'<div class=c><b>'+c.name+'</b><br><small>'+c.kind+(c.type?' • '+c.type:'')+'</small><br><button onclick="add(\\''+c.name.replaceAll("'","\\\\'")+'\\')">ADD</button></div>').join("");let g={};d.forEach(x=>g[x]=(g[x]||0)+1);count.textContent=d.length+' / 40';list.innerHTML=Object.entries(g).map(([n,c])=>'<div class=row>'+n+' x'+c+' <button onclick="rm(\\''+n.replaceAll("'","\\\\'")+'\\')">−</button></div>').join("")||"Empty";}function add(n){if(d.length<40&&d.filter(x=>x===n).length<4)d.push(n);r()}function rm(n){let i=d.lastIndexOf(n);if(i>=0)d.splice(i,1);r()}function save(){localStorage.setItem("nexoraDeck",JSON.stringify(d));alert("Deck saved.")}r()</script></body></html>
