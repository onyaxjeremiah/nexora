<!doctype html><html><head><meta charset="utf-8"><title>Nexora Rooms</title><link rel="stylesheet" href="style.css"></head><body><header><b>NEXORA</b><span>ROOMS</span></header><main class="panel"><h1>Battle Room</h1><input id="code" placeholder="ROOM CODE" maxlength="6"><button onclick="join()">JOIN ROOM</button><button onclick="create()">CREATE ROOM</button><p id="msg"></p><p class="muted">Use the saved 40-card deck.</p></main><script>
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host),u=localStorage.getItem("nexoraUser")||"Player";
function deck(){return JSON.parse(localStorage.getItem("nexoraDeck")||"[]")}function create(){if(deck().length!==40)return msg("Build exactly 40 cards first.");ws.send(JSON.stringify({type:"create",name:u,deck:deck()}))}function join(){if(deck().length!==40)return msg("Build exactly 40 cards first.");ws.send(JSON.stringify({type:"join",code:document.getElementById("code").value,name:u,deck:deck()}))}function msg(x){document.getElementById("msg").textContent=x}
ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==="room"){localStorage.setItem("nexoraRoom",m.code);localStorage.setItem("nexoraPid",m.pid);location.href="/battle.html?room="+m.code;}if(m.type==="error")msg(m.msg)}
</script></body></html>
